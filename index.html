<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D FPS</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        z-index: 10;
        font-family: Arial;
      }

      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        margin-top: -5px;
        border: 2px solid white;
        border-radius: 50%;
        z-index: 10;
      }
      #health {
        position: absolute;
        top: 40px;
        left: 10px;
        color: red;
        font-size: 20px;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="info">Click to play | WASD to move</div>
    <div id="health">Health: 100</div>
    <div id="crosshair"></div>

    <!-- 🔥 Import map (this is the key) -->
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/examples/": "./node_modules/three/examples/"
        }
      }
    </script>

    <script type="module" src="./main.js"></script>
  </body>
</html>
